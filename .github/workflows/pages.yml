# Rebuilds the evals and publishes the console to GitHub Pages on every push to main.
# Deploys by pushing site/ to the gh-pages branch, which GitHub serves without any
# repository setting. If the site does not appear within a few minutes of the first
# run: Settings > Pages > Source: Deploy from a branch > gh-pages / root.
name: console
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m venv .venv && .venv/bin/pip install -q -e ".[dev]"
      - run: make test
      - run: make eval          # heuristic backend unless ANTHROPIC_API_KEY is set as a repo secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: make site
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
